<!DOCTYPE html>
<html>
<head>
  <title>Smart Bin</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; }
    h1 { color: #2c3e50; }
  </style>
</head>
<body>
  <h1>Smart Bin</h1>
  <p>Distance: <span id="dist">--</span> cm</p>

  <script>
    async function loadData() {
      const url = 'https://api.thingspeak.com/channels/3533253/fields/1.json?results=2';
      const res = await fetch(url);
      const data = await res.json();
      document.getElementById('dist').textContent = data.field1 || '--';
    }
    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
